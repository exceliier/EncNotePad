name: encnotepad
description: "EncNotePad - Secure, 100% offline structured notes editor with AES-256-GCM and on-device shadow copies."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cryptography: ^2.7.0
  flutter_bloc: ^8.1.3
  file_picker: ^8.0.0
  path_provider: ^2.1.2
  window_manager: ^0.3.8
  path: ^1.9.0
  uuid: ^4.4.0
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
